[package]
name = "anchor-cli"
description = "Terminal front-end for Anchor: models, chat, benchmarks, storage, and memory fit."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "anchor"
path = "src/main.rs"

[features]
e2e = []

[dependencies]
anchor-core = { workspace = true }
anchor-hub = { workspace = true }
anchor-system = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
# `signal` is what turns Ctrl-C during a benchmark into a clean stop.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
