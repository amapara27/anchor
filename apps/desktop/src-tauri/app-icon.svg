<?xml version="1.0" encoding="UTF-8"?>
<!-- Anchor app icon. Source of truth; regenerate app-icon.png with:
     rsvg-convert -w 1024 -h 1024 app-icon.svg -o app-icon.png
     then: pnpm exec tauri icon src-tauri/app-icon.png -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Slate surface gradient (matches the app's canvas/surface tokens). -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16213b"/>
      <stop offset="1" stop-color="#0a0f1d"/>
    </linearGradient>
    <!-- Soft emerald glow behind the mark ("minimal glow" effect). -->
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#34d399" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <!-- Emerald sheen for the anchor stroke (emerald-300 → emerald-500).
         userSpaceOnUse (glyph coords) so axis-aligned lines still paint. -->
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="12" y1="2.5" x2="12" y2="21">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Rounded-rect background on the macOS icon grid (824 sq, ~185 corners). -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <!-- Subtle hairline edge for definition on dark Dock backgrounds. -->
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none" stroke="#243049" stroke-width="2"/>

  <!-- Emerald glow pool. -->
  <ellipse cx="512" cy="502" rx="300" ry="300" fill="url(#glow)"/>

  <!-- Anchor glyph (same mark used in-app), scaled and centered. -->
  <g transform="translate(200,206.5) scale(26)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blurred emerald halo of the mark itself. -->
    <g stroke="#34d399" stroke-width="1.75" opacity="0.5" filter="url(#halo)">
      <circle cx="12" cy="5" r="2.5"/>
      <path d="M12 7.5V21"/>
      <path d="M5 12H3a9 9 0 0 0 18 0h-2"/>
      <path d="M8 12H16"/>
    </g>
    <!-- Crisp mark. -->
    <g stroke="url(#mark)" stroke-width="1.75">
      <circle cx="12" cy="5" r="2.5"/>
      <path d="M12 7.5V21"/>
      <path d="M5 12H3a9 9 0 0 0 18 0h-2"/>
      <path d="M8 12H16"/>
    </g>
  </g>
</svg>
