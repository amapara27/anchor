[package]
name = "anchor-desktop"
description = "Anchor desktop application."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The Tauri-recommended layout: a library that both the binary and mobile
# entry points call into.
name = "anchor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anchor-core = { workspace = true }
anchor-hub = { workspace = true }
anchor-search = { workspace = true }
anchor-system = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["sync"] }

