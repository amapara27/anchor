[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/anchor-core",
    "crates/anchor-hub",
    "crates/anchor-workflows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aayan Mapara"]
repository = "https://github.com/aayanmapara/anchor"

[workspace.dependencies]
anchor-core = { path = "crates/anchor-core" }
anchor-hub = { path = "crates/anchor-hub" }
anchor-workflows = { path = "crates/anchor-workflows" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
