[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/anchor-cli",
    "crates/anchor-core",
    "crates/anchor-hub",
    "crates/anchor-search",
    "crates/anchor-system",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aayan Mapara"]
repository = "https://github.com/amapara27/anchor"

[workspace.dependencies]
anchor-core = { path = "crates/anchor-core" }
anchor-hub = { path = "crates/anchor-hub" }
anchor-search = { path = "crates/anchor-search" }
anchor-system = { path = "crates/anchor-system" }
serde = { version = "1", features = ["derive"] }
fastembed = "5"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
